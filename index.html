<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quoto</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#192e40">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
<style>
body{background:var(--band);color:var(--band-text);min-height:100vh;display:flex;align-items:center}
.platz{display:grid;gap:28px;padding-block:64px}
.platz .marke{font-size:clamp(64px,14vw,140px)}
.platz h1{font:700 clamp(30px,5vw,48px)/1.1 var(--f-display);letter-spacing:-.02em;margin:0}
.platz h1 .r{color:#ff8f78}
.platz p{color:var(--band-leise);margin:0;max-width:44ch;font-size:clamp(18px,2.2vw,21px)}
</style>
</head>
<body>
<main class="wrap platz">
  <span class="marke" role="img" aria-label="quoto">
    <span class="quot" aria-hidden="true">quot</span>
    <span class="rolle" aria-hidden="true"><svg viewBox="0 0 100 100"><path d="M79.54 55.21 A30 30 0 1 1 44.79 20.46" fill="none" stroke="#fff" stroke-width="17"/><path d="M50 20 A30 30 0 0 1 80 50" fill="none" stroke="#d1ebff" stroke-width="17" transform="translate(4 -4)"/></svg></span>
  </span>
  <h1>Kosten rein. <span class="r">Anteile raus.</span></h1>
  <p>Hier entsteht die Website von Quoto.</p>
</main>
</body>
</html>
